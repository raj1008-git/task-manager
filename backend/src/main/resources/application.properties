spring.application.name=taskmanager
server.port=8080

# Database connection (password comes from an environment variable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USERNAME:taskapp}
spring.datasource.password=${DB_PASSWORD}

# We own the schema (database/schema.sql). Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
